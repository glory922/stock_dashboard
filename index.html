<script>
// 读取表格所有单元格内容
function getTableData(tableId){
    const table = document.getElementById(tableId);
    const cells = table.querySelectorAll('td[contenteditable]');
    let arr = [];
    cells.forEach(td=>arr.push(td.innerText.trim()));
    return arr;
}
// 回填数据到表格
function setTableData(tableId, dataArr){
    const table = document.getElementById(tableId);
    const cells = table.querySelectorAll('td[contenteditable]');
    cells.forEach((td,idx)=>{
        if(dataArr[idx]!==undefined) td.innerText = dataArr[idx];
    })
}

// 保存
function saveData(){
    const store = {
        t1: getTableData('table1'),
        t2: getTableData('table2'),
        t3: getTableData('table3')
    }
    localStorage.setItem("stockData", JSON.stringify(store));
    alert("✅数据保存成功！刷新页面不会丢");
}
// 清空
function clearData(){
    if(confirm("确定清空全部表格数据吗？")){
        localStorage.removeItem("stockData");
        location.reload();
    }
}
// 页面加载自动读取
window.onload = function(){
    const raw = localStorage.getItem("stockData");
    if(raw){
        const data = JSON.parse(raw);
        setTableData("table1", data.t1);
        setTableData("table2", data.t2);
        setTableData("table3", data.t3);
    }
}
</script>
